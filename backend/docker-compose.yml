services:
  db:
    image: pgrouting/pgrouting:15-3.5-3.7
    container_name: safeway_db
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-safeway_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-safeway_pass}
      POSTGRES_DB: ${DB_NAME:-safeway_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: safeway_pgadmin
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@safeway.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "True"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db
    restart: always

volumes:
  pgdata:
  pgadmin_data:
