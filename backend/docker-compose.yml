version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: safeway_db
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-safeway_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-safeway_pass}
      POSTGRES_DB: ${DB_NAME:-safeway_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

volumes:
  pgdata:
